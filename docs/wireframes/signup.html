<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account</title><link rel="stylesheet" href="site.css"></head><body class=""><div class="auth"><div class="auth-form"><a class="logo" href="index.html"><i><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></i>Product name</a><div class="auth-card"><h1>Create your account</h1><p class="sub">Sign-up sub-heading goes here.</p><div class="sso"><button class="btn line" type="button" data-toast="Single sign-on comes with the backend"><span class="g">G</span>Google</button><button class="btn line" type="button" data-toast="Single sign-on comes with the backend"><span class="g m">M</span>Microsoft</button></div><div class="or">or</div><form id="sf" novalidate><label class="f" id="f-name"><span>Full name</span><input class="inp" id="name" placeholder="Name goes here" autocomplete="name"><div class="err"></div></label><label class="f" id="f-email"><span>Work email</span><input class="inp" id="email" type="email" placeholder="Email goes here" autocomplete="email"><div class="err"></div></label><label class="f" id="f-pw"><span>Password</span><div class="pw"><input class="inp" id="pw" type="password" placeholder="At least 8 characters" autocomplete="current-password"><button type="button" data-eye="pw" title="Show password"><svg viewBox="0 0 24 24"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="meter" id="meter"><i></i><i></i><i></i><i></i></div><div class="mlbl" id="mlbl">Use 8 or more characters</div><div class="err"></div></label><label class="f" id="f-terms" style="margin-top:20px"><span class="chk" style="font-weight:400;margin:0"><input type="checkbox" id="terms">I agree to the Terms and Privacy Policy</span><div class="err">Please accept to continue</div></label><button class="btn lg block" style="margin-top:20px" type="submit">Create account</button></form><p class="alt-l">Already have an account? <a href="login.html">Sign in</a></p></div><span class="muted" style="font-size:13px;text-align:center">Small print goes here &middot; <a class="link" href="index.html">Back to home</a></span></div><aside class="auth-side"><div class="mock"><div class="mock-bar"><i></i><i></i><i></i></div><div class="mock-body"><div class="mk-rail"><b class="on"></b><b class="co"></b><b></b><b></b><b></b></div><div class="mk-side"><span class="h"></span><span class="on"></span><span></span><span></span><span class="h" style="margin-top:10px"></span><span></span><span></span></div><div class="mk-chat"><div class="mk-msg"><div class="a v"></div><div class="l"><span class="n"></span><span style="width:92%"></span><span style="width:64%"></span></div></div><div class="mk-msg"><div class="a t"></div><div class="l"><span class="n"></span><span style="width:78%"></span><span style="width:40%"></span></div></div><div class="mk-msg"><div class="a "></div><div class="l"><span class="n"></span><span style="width:86%"></span><span style="width:58%"></span></div></div><div class="mk-comp"></div></div></div></div><div class="quote"><blockquote>Customer quote goes here. A sentence or two about the product.</blockquote><div class="by"><span class="av">N</span><div><b>Name goes here</b><small>Job title goes here, Company name goes here</small></div></div></div></aside></div><script src="site.js"></script><script>
  const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  function bad(id,msg){const f=document.getElementById('f-'+id);f.classList.add('bad');f.querySelector('.err').textContent=msg;return false}
  function clear(){document.querySelectorAll('.f.bad').forEach(f=>f.classList.remove('bad'))}
  document.addEventListener('input',e=>{const f=e.target.closest('.f');if(f)f.classList.remove('bad')});
  document.addEventListener('click',e=>{const b=e.target.closest('[data-eye]');if(!b)return;
    const i=document.getElementById(b.dataset.eye);const show=i.type==='password';i.type=show?'text':'password';
    b.innerHTML=show?'<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A9.7 9.7 0 0 1 12 5c6 0 9.5 7 9.5 7a15 15 0 0 1-3.1 4M6.2 6.3A15 15 0 0 0 2.5 12S6 19 12 19a9.7 9.7 0 0 0 4-.9"/></svg>':'<svg viewBox="0 0 24 24"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3"/></svg>';b.title=show?'Hide password':'Show password'});

  const pw=document.getElementById('pw'),meter=document.getElementById('meter'),lbl=document.getElementById('mlbl');
  const score=v=>{let s=0;if(v.length>=8)s++;if(/[a-z]/.test(v)&&/[A-Z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^A-Za-z0-9]/.test(v)||v.length>=14)s++;return v?Math.max(1,s):0};
  pw.addEventListener('input',()=>{const s=score(pw.value);meter.className='meter'+(s?' s'+s:'');lbl.textContent=['Use 8 or more characters','Weak','Okay','Good','Strong'][s]});
  document.getElementById('sf').addEventListener('submit',e=>{e.preventDefault();clear();let ok=true;
    const n=document.getElementById('name').value.trim(),em=document.getElementById('email').value.trim();
    if(!n)ok=bad('name','Enter your name');
    if(!EMAIL.test(em))ok=bad('email','Enter a valid email address');
    if(pw.value.length<8)ok=bad('pw','Use at least 8 characters');
    if(!document.getElementById('terms').checked)ok=bad('terms','');
    if(!ok)return;
    store.set('user',{name:n,email:em});
    const b=e.target.querySelector('button[type=submit]');b.textContent='Creating account…';b.disabled=true;
    setTimeout(()=>{location.href='create-company.html?new=1'},500)});
</script></body></html>
